<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/styles.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>Shop Now - Urban Threads</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-darkslategrey">
        <a class="navbar-brand" href="/homepage">Urban Threads</a>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="/">Login</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/register">Register</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/cart" id="cart-link">Your Cart (0)</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="shopContainer my-5">
        <h2 class="text-center">Shop Our Collection</h2>
        <div class="row">
            <div class="col-md-3">
                <h5>Filter by Category</h5>
                <ul class="list-group">
                    <li class="list-group-item"><a href="#" class="category-filter" data-category="all">All</a></li>
                    <li class="list-group-item"><a href="#" class="category-filter" data-category="men">Men</a></li>
                    <li class="list-group-item"><a href="#" class="category-filter" data-category="women">Women</a></li>
                    <li class="list-group-item"><a href="#" class="category-filter" data-category="accessories">Accessories</a></li>
                </ul>
            </div>
            <div class="col-md-9">
                <div class="row g-3" id="product-list">
                    <!-- Product Cards will be dynamically inserted here -->
                    {% for product in products %}
                    <div class="col-12 col-md-6 col-lg-4 col-xl-3 mb-4 product-card" data-category="{{ product['category'] }}">
                        <div class="product">
                            <img src="{{ product['imageURL'] }}" alt="{{ product['name'] }}" class="img-fluid">
                            <h3>{{ product['name'] }}</h3>
                            <p>₹{{ product['price'] }}</p>
                            <button class="btn btn-primary add-to-cart" 
                                    data-product-name="{{ product['name'] }}" 
                                    data-product-price="{{ product['price'] }}" 
                                    data-product-image="{{ product['imageURL'] }}">
                                Add to Cart
                            </button>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>


    <script>
        // Function to add item to the cart
        function addToCart(productName, productPrice, productImage) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            const productId = Date.now() + Math.floor(Math.random() * 1000);  // Unique ID
            cart.push({
                id: productId, 
                name: productName, 
                price: productPrice, 
                image: productImage
            });
            localStorage.setItem('cart', JSON.stringify(cart));
            
            console.log("Product added to cart:", productName); // Debugging message
            updateCartCount(); // Update the cart count immediately
        }

        // Function to update cart count in the navbar
        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const cartCount = cart.length;
            document.getElementById('cart-link').textContent = `Your Cart (${cartCount})`;
        }

        // Listen for "Add to Cart" button clicks
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('add-to-cart')) {
                const productName = e.target.getAttribute('data-product-name');
                const productPrice = e.target.getAttribute('data-product-price');
                const productImage = e.target.getAttribute('data-product-image');
                addToCart(productName, productPrice, productImage);
            }
        });

        // Listen for category filter clicks
        document.querySelectorAll('.category-filter').forEach(function(link) {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const category = e.target.getAttribute('data-category');
                const productCards = document.querySelectorAll('.product-card');
                
                if (category === 'all') {
                    productCards.forEach(card => card.style.display = 'block');
                } else {
                    productCards.forEach(card => {
                        card.style.display = card.getAttribute('data-category') === category ? 'block' : 'none';
                    });
                }
            });
        });

        // Initialize cart count on page load
        document.addEventListener('DOMContentLoaded', function() {
            updateCartCount();  // Update the cart count on page load
        });
    </script>

        <!-- Script to display message popup -->
        <script>
            // Check if a 'message' parameter is present in the URL
            const urlParams = new URLSearchParams(window.location.search);  // Get query parameters
            const message = urlParams.get('message');  // Extract the 'message' value
    
            if (message) {
                // If there's a message, show it in a popup (alert)
                alert(message);
            }
        </script>
</body>
</html>
